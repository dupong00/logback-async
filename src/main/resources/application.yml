spring:
  application:
    name: logback-async
  threads:
    virtual:
      enabled: false

server:
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

app:
  # 실행 번호는 기동 인자 --app.run-id=0001로 받는다. 결과는 runs/<실행 번호>/에 쌓인다
  runs-dir: runs
